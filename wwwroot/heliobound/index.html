<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HelioEngine on Mind Goblin.">
  <title>HelioEngine · Mind Goblin</title>
  <link rel="icon" type="image/png" href="./mind-goblin.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./launcher.js"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" aria-label="Mind Goblin home"><img src="./mind-goblin.png" width="32" height="32" alt=""><span>Mind Goblin</span></a>
      <div class="controls"><button id="retry-audio" hidden>Retry audio</button><button id="fullscreen">Fullscreen</button></div>
    </header>
    <div class="notices">
      <p id="status" role="status" aria-live="polite" hidden></p>
      <p id="input-status" role="status" hidden></p>
      <p id="audio-status" role="status" hidden></p>
    </div>
    <div id="screen">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="HelioEngine game"></canvas>
      <div id="launch-controls"><button id="start">Start with audio</button><button id="muted">Play muted</button></div>
      <button id="exit-fullscreen">Exit fullscreen</button>
    </div>
    <noscript>JavaScript is required to play.</noscript>
  </main>
</body>
</html>
