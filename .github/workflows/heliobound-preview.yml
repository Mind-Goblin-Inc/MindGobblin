name: HelioBound bundle checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify imported bundle
        run: python3 tools/verify_heliobound.py
      - name: Verify manifest validation rejects corruption
        run: python3 -m unittest discover -s tools -p 'test_heliobound*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build local image only
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mindgoblin:preview-check
      - name: Check served game and homepage
        run: |
          docker run --rm -d --tmpfs /data --name preview-check -p 127.0.0.1:8080:8080 mindgoblin:preview-check
          python3 tools/check_heliobound_http.py http://127.0.0.1:8080
