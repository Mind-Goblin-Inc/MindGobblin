name: HelioEngine bundle checks
on:
  push:
    branches: ['feature/helioengine-*', 'fix/helioengine-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify imported bundle
        run: python3 tools/verify_heliobound.py
      - name: Verify bundle validation and HTTP startup retries
        run: python3 -m unittest discover -s tools -p 'test_heliobound*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build local image only
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mindgoblin:preview-check
      - name: Check served game and homepage
        run: |
          docker run -d --tmpfs /data --name preview-check -e ASPNETCORE_URLS=http://0.0.0.0:8080 -p 127.0.0.1:8080:8080 mindgoblin:preview-check
          python3 tools/check_heliobound_http.py http://127.0.0.1:8080
      - name: Show preview container failure details
        if: failure()
        run: |
          docker logs preview-check || true
          docker inspect --format '{{json .State}}' preview-check || true
      - name: Remove preview container
        if: always()
        run: docker rm -f preview-check || true
